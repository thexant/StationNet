plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def releaseVersion = providers.gradleProperty('stationnetVersion').get()
def releaseVersionCode = providers.gradleProperty('stationnetVersionCode').get().toInteger()
def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def signingReady = signingKeys.every { signingProperties.getProperty(it)?.trim() }

android {
    namespace 'net.stationnet.android'
    compileSdk 35
    defaultConfig {
        applicationId 'net.stationnet.android'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersion
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                output.outputFileName = "StationNet-Android-v${releaseVersion}.apk"
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path == ':app:assembleRelease' || it.path == ':app:packageRelease' } && !signingReady) {
        throw new GradleException('Release signing requires android/keystore.properties with storeFile, storePassword, keyAlias, and keyPassword.')
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'Flask==3.1.2'
            // Chaquopy's Android wheel repository has 11.0.0 for CPython 3.11,
            // but does not have the desktop pin (11.3.0).
            install 'Pillow==11.0.0'
            install 'pyfiglet==1.0.4'
            install 'uvicorn>=0.30,<1'
            install 'websockets>=12,<17'
            install 'tzdata>=2025.2'
        }
    }
}

def syncStationnet = tasks.register('syncStationnet', Sync) {
    from('../../stationnet') {
        exclude '**/__pycache__/**', '**/*.pyc'
    }
    into 'src/main/python/stationnet'
}
tasks.named('preBuild') { dependsOn syncStationnet }

// Chaquopy registers its variant-specific merge tasks after this script is
// evaluated. Configure matching tasks lazily, while still declaring the
// producer/consumer relationship Gradle's validation requires.
tasks.matching { it.name.endsWith('PythonSources') }.configureEach {
    dependsOn syncStationnet
}
