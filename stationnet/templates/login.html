{% extends 'base.html' %}{% block title %}Authenticate{% endblock %}{% block content %}<section class="narrow terminal-card"><p class="eyebrow">IDENTITY CHALLENGE</p><h1>Establish authenticated link</h1><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Username<input name="username" required autofocus autocomplete="username" value="{{ request.form.username or '' }}"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>CONNECT</button></form>{% if g.station.registration_open %}<p>Unassigned operator? <a href="{{ url_for('auth.register') }}">Request a local callsign.</a></p>{% endif %}</section>{% endblock %}
