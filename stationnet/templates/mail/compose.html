{% extends 'base.html' %}
{% block title %}Compose Mail{% endblock %}
{% block content %}
<section class="terminal-card"><p class="eyebrow">PRIVATE MAIL / COMPOSE</p><h1>New message</h1>
<form method="post" class="form-grid" data-sfx-submit="emailsent"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
<label>Recipient<select name="recipient_id" required><option value="">SELECT REGISTERED USER</option>{% for user in recipients %}<option value="{{ user.id }}" {% if recipient_id==user.id %}selected{% endif %}>{{ user.callsign }} / {{ user.username }}</option>{% endfor %}</select></label>
<label>Subject<input name="subject" maxlength="120" required value="{{ request.form.subject or '' }}"></label>
<label>Message<textarea name="body" maxlength="10000" rows="12" required>{{ request.form.body or '' }}</textarea></label><button>DELIVER PRIVATE MAIL</button></form></section>
{% endblock %}
