<aside class="radio-player minimized" data-radio-player aria-label="Station radio player">
  <div class="radio-player-state">
    <button type="button" class="radio-player-toggle secondary" data-radio-player-toggle aria-expanded="false" aria-label="Expand radio player">R</button>
    <i class="signal-lamp" data-radio-lamp aria-hidden="true"></i>
    <button type="button" class="radio-power secondary" data-radio-power aria-pressed="false">POWER: OFF</button>
    <output data-radio-frequency>---.--</output><span>MHz</span>
    <span class="radio-player-status" data-radio-receiver-name hidden></span>
    <span class="radio-player-status" data-radio-status>OFF</span>
    <span class="radio-player-status radio-broadcast-status" data-radio-broadcast-status hidden></span>
    <span class="radio-player-status radio-now-playing" data-radio-now-playing hidden></span>
    <span class="radio-player-status radio-now-playing-artist" data-radio-now-playing-artist hidden></span>
  </div>
  <div class="radio-player-controls">
    <button type="button" class="secondary" data-radio-step="-500" aria-label="Tune down 0.50 MHz">− 0.50</button>
    <label class="radio-frequency-entry">MHz <input data-radio-input type="text" inputmode="decimal" enterkeyhint="go" autocomplete="off" pattern="[0-9]{1,3}(\.[0-9]{1,2})?" maxlength="6" placeholder="145.00" aria-label="Frequency in MHz"></label>
    <button type="button" class="secondary" data-radio-tune>TUNE</button>
    <button type="button" class="secondary" data-radio-step="500" aria-label="Tune up 0.50 MHz">+ 0.50</button>
    <label>VOL <input data-radio-volume type="range" min="0" max="100" value="55"></label>
    <button type="button" class="secondary" data-radio-mute aria-pressed="false">MUTE: OFF</button>
    <a class="button radio-open" href="{{ url_for('radio.console') }}">OPEN RADIO</a>
  </div>
  <p class="chat-error radio-player-error" data-radio-error aria-live="polite"></p>
</aside>
