{% extends 'base.html' %}
{% block title %}SYSOP Settings{% endblock %}
{% block content %}
<section class="narrow terminal-card">
  <p class="eyebrow">SYSOP CONTROL / STATION PARAMETERS</p>
  <h1>Station settings</h1>
  <p>Callsign <strong>{{ g.station.callsign }}</strong> has been assigned to this station.</p>
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Station name
      <input name="name" maxlength="80" required value="{{ g.station.name }}">
    </label>
    <label>Station description
      <textarea name="description" maxlength="500" rows="5">{{ g.station.description }}</textarea>
    </label>
    <label>Landing message
      <textarea name="landing_message" maxlength="500" rows="4" placeholder="Use the automatic access-aware welcome message">{{ g.station.landing_message }}</textarea>
      <small>Shown on the station landing page. Leave blank to use a message that automatically reflects guest access.</small>
    </label>
    <label>Header tagline
      <input name="brand_tagline" maxlength="160" required value="{{ g.station.brand_tagline }}">
      <small>Shown beneath the station logo on every page.</small>
    </label>
    <label class="switch"><input type="checkbox" name="registration_open" {% if g.station.registration_open %}checked{% endif %}> Allow new local registrations</label>
    <label class="switch"><input type="checkbox" name="guest_access" {% if g.station.guest_access %}checked{% endif %}> Allow guests to read bulletins</label>
    <div class="divider">FILE ARCHIVE POLICY</div>
    <label>Who may upload
      <select name="upload_permission">
        <option value="members" {% if g.station.upload_permission=='members' %}selected{% endif %}>All registered users</option>
        <option value="admins" {% if g.station.upload_permission=='admins' %}selected{% endif %}>Station operators only</option>
        <option value="disabled" {% if g.station.upload_permission=='disabled' %}selected{% endif %}>Uploads disabled</option>
      </select>
    </label>
    <label>Total archive storage (MB)<input type="number" name="file_storage_limit_mb" min="1" max="10240" required value="{{ g.station.file_storage_limit_mb }}"></label>
    <label>Maximum file size (MB)<input type="number" name="file_size_limit_mb" min="1" max="64" required value="{{ g.station.file_size_limit_mb }}"></label>
    <p><a href="{{ url_for('announcements.index') }}">MANAGE STATION ANNOUNCEMENTS</a></p>
    <button>COMMIT PARAMETERS</button>
  </form>
</section>
{% endblock %}
