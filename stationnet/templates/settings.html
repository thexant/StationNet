{% extends 'base.html' %}{% block title %}SYSOP Settings{% endblock %}{% block content %}<section class="narrow terminal-card"><p class="eyebrow">SYSOP CONTROL / STATION PARAMETERS</p><h1>Station settings</h1><p>Callsign <strong>{{ g.station.callsign }}</strong> is fixed in this milestone.</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Station name<input name="name" maxlength="80" required value="{{ g.station.name }}"></label><label>Station description<textarea name="description" maxlength="500" rows="5">{{ g.station.description }}</textarea></label><label class="switch"><input type="checkbox" name="registration_open" {% if g.station.registration_open %}checked{% endif %}> Allow new local registrations</label><label class="switch"><input type="checkbox" name="guest_access" {% if g.station.guest_access %}checked{% endif %}> Allow guests to read bulletins</label><button>COMMIT PARAMETERS</button></form></section>{% endblock %}
