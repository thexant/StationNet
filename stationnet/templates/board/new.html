{% extends 'base.html' %}{% block title %}New Bulletin{% endblock %}{% block content %}<section class="narrow terminal-card"><p class="eyebrow">POST A BULLETIN</p><h1>Compose bulletin</h1><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Subject<input name="title" minlength="3" maxlength="120" required autofocus value="{{ request.form.title or '' }}"></label><label>Message<textarea name="body" maxlength="5000" rows="12" required>{{ request.form.body or '' }}</textarea></label><div class="button-row"><button>POST</button><a class="button secondary" href="{{ url_for('board.index') }}">CANCEL</a></div></form></section>{% endblock %}
