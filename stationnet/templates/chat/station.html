{% extends 'base.html' %}
{% block title %}Station Chat{% endblock %}
{% block content %}
<section class="terminal-card live-chat" data-live-chat data-messages-url="{{ url_for('chat.station_messages') }}">
  <p class="eyebrow">STATION PUBLIC CHAT</p>
  <h1>Station chat</h1>
  <p class="muted">Persistent station-wide traffic.</p>
  <div class="chat-log" data-chat-log role="log" aria-live="polite"><p class="muted" data-chat-empty>Quiet for now...</p></div>
  <form class="chat-compose" data-chat-form>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Transmit as {{ g.user.username }} - [{{ g.user.callsign }}]<textarea name="body" maxlength="1000" rows="3" required></textarea><small>Press Enter to send. Shift+Enter starts a new line.</small></label>
    <button>SEND</button><span class="chat-error" data-chat-error aria-live="polite"></span>
  </form>
</section>
{% endblock %}
