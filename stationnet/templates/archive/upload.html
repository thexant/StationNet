{% extends 'base.html' %}
{% block title %}Upload File{% endblock %}
{% block content %}<section class="terminal-card"><p class="eyebrow">FILE ARCHIVE / UPLOAD</p><h1>Add shared file</h1><p class="muted">Maximum file size: {{ g.station.file_size_limit_mb }} MB.</p><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>File<input type="file" name="file" required></label><label>Category<select name="category" required>{% for name in categories %}<option>{{ name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" maxlength="500" rows="5"></textarea></label><button>UPLOAD TO ARCHIVE</button></form></section>{% endblock %}
