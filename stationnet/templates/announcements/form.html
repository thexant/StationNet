{% extends 'base.html' %}
{% block title %}{{ 'Edit' if announcement else 'New' }} Announcement{% endblock %}
{% block content %}<section class="terminal-card"><p class="eyebrow">SYSOP CONTROL / ANNOUNCEMENTS</p><h1>{{ 'Edit announcement' if announcement else 'New announcement' }}</h1><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Title<input name="title" maxlength="120" required value="{{ request.form.title or (announcement.title if announcement else '') }}"></label><label>Announcement<textarea name="body" maxlength="5000" rows="12" required>{{ request.form.body or (announcement.body if announcement else '') }}</textarea></label>{% include 'polls/_advanced.html' %}<button>{{ 'UPDATE' if announcement else 'PUBLISH' }} ANNOUNCEMENT</button></form></section>{% endblock %}
