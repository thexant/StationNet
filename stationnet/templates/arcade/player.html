<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ game.title }} · EmulatorJS</title><style>html,body,#game{margin:0;width:100%;height:100%;min-height:100%;background:#000;overflow:hidden}</style></head><body><div id="game"></div><script>
window.EJS_player = '#game';
window.EJS_core = {{ core|tojson }};
window.EJS_gameName = {{ game.title|tojson }};
window.EJS_gameID = {{ game.id }};
window.EJS_gameUrl = {{ (url_for('arcade.named_rom',game_id=game.id,filename=game.original_name) if game.platform == 'arcade' else url_for('arcade.rom',game_id=game.id))|tojson }};
window.EJS_pathtodata = {{ url_for('arcade.asset',asset='')|tojson }};
window.EJS_startOnLoaded = true;
window.EJS_sourceFiles = true;
window.EJS_disableAutoLang = true;
window.EJS_disableLocalStorage = true;
{% if threads %}window.EJS_threads = true;
{% endif %}window.EJS_defaultOptions = {
  retroarch_core: {{ core|tojson }},
  ejs_threads: '{{ 'enabled' if threads else 'disabled' }}',
  'mame2003-plus_skip_warnings': 'enabled',
  'mame2003-plus_skip_disclaimer': 'enabled'
};
</script><script src="{{ url_for('arcade.asset',asset='loader.js') }}"></script></body></html>
