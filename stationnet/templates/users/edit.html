{% extends 'base.html' %}
{% block title %}Edit {{ profile.callsign }} Profile{% endblock %}
{% block content %}
<section class="narrow terminal-card">
  <p class="eyebrow">USER PROFILE / EDIT</p>
  <h1>Edit {{ profile.callsign }}</h1>
  <form method="post" enctype="multipart/form-data" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Profile photo
      <input type="file" name="profile_photo" accept="image/png,image/jpeg,image/gif,image/webp">
      <small>PNG, JPEG, GIF, or WebP. Images are resized to fit within 128 × 128 pixels. A new upload replaces the current photo.</small>
    </label>
    {% if profile.profile_photo_filename %}<img class="profile-photo profile-photo-preview" src="{{ url_for('users.profile_photo',user_id=profile.id) }}" alt="Current profile photo" width="128" height="128">{% endif %}
    <label>Tagline<input name="tagline" maxlength="120" value="{{ profile.tagline }}"></label>
    <label>About me<textarea name="about" maxlength="2000" rows="8">{{ profile.about }}</textarea></label>
    <label>Birthday<input type="date" name="birthday" value="{{ profile.birthday or '' }}"></label>
    <label>Gender<input name="gender" maxlength="40" value="{{ profile.gender }}"></label>
    <div class="button-row"><button>UPDATE MY PROFILE</button><a class="button secondary" href="{{ url_for('users.profile',user_id=profile.id) }}">RETURN TO PROFILE</a></div>
  </form>
</section>
{% endblock %}
