{% extends 'base.html' %}{% block title %}Request Callsign{% endblock %}{% block content %}<section class="narrow terminal-card"><p class="eyebrow">LOCAL ACCOUNT ENROLLMENT</p><h1>Request station identity</h1><p>A unique station-local callsign will be assigned.</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Username<input name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_-]{3,24}" required autofocus value="{{ request.form.username or '' }}"></label><label>Password<input type="password" name="password" minlength="10" maxlength="128" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="10" maxlength="128" required></label><button>CREATE LOCAL ACCOUNT</button></form></section>{% endblock %}
